<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="card">
        <div class="card-badge">NUEVO</div>
        <h3 class="card-title">Laptop Pro X</h3>
        <p class="card-desc">Procesador i7, 16GB RAM, 512GB SSD</p>
        <span class="card-price">$450.000</span>
        <button class="card-btn">Agregar al carrito</button>
    </div>
    
    <style>
        * {
            box-sizing: border-box;
        }

        .card{
            width: 280px;
            border-color: grey; 
            border-radius: 8px;
            padding: 20px;
            /*horizontal vertical*/
            box-shadow: 10px 10px 10px 0 grey;
        }

        .card-badge {
            background: #27ae60;
            color: white;
            font-size: small;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .card-price {
            background: #e67e22;
            width: 1.5rem;
            font-weight: bold;
        }

        .card-btn {
            background: #2980b9;
            color: white;
            border: none;
            padding: 10px 20px;
            width: 100%;
        }

        .card-btn:hover {
            background: #1a6497;
        }
    </style>
</body>
</html>
